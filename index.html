<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NuDay Knowledge Graph</title>
    <script src="d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            overflow: hidden;
            height: 100vh;
        }
        
        #header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 10px 20px;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        #header h1 {
            font-size: 1.0rem;
            color: #f1c40f;
            font-weight: 600;
        }
        
        #nav-tabs {
            display: flex;
            gap: 5px;
        }
        
        .nav-tab {
            padding: 6px 14px;
            border: none;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.85rem;
            text-decoration: none;
        }
        
        .nav-tab:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        
        .nav-tab.active {
            background: rgba(241, 196, 15, 0.3);
            color: #f1c40f;
        }
        
        #controls {
            display: flex;
            gap: 10px;
        }
        
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            background: rgba(255,255,255,0.1);
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        
        button:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        
        #graph {
            width: 100vw;
            height: 100vh;
        }
        
        .node {
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .node:hover {
            filter: brightness(1.3);
        }
        
        .node-circle {
            stroke: #fff;
            stroke-width: 2px;
            transition: all 0.3s;
        }
        
        .node-label {
            font-size: 12px;
            fill: #fff;
            text-anchor: middle;
            pointer-events: none;
            font-weight: 500;
        }
        
        .node-emoji {
            font-size: 20px;
            text-anchor: middle;
            pointer-events: none;
        }
        
        .link {
            stroke: rgba(255,255,255,0.3);
            stroke-width: 1.5px;
            transition: all 0.3s;
        }
        
        .link-label {
            font-size: 10px;
            fill: rgba(255,255,255,0.6);
            text-anchor: middle;
            pointer-events: none;
        }
        
        .link:hover {
            stroke: rgba(255,255,255,0.6);
            stroke-width: 2.5px;
        }
        
        #tooltip {
            position: fixed;
            padding: 12px 16px;
            background: rgba(0,0,0,0.9);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 1000;
            max-width: 250px;
        }
        
        #tooltip.visible {
            opacity: 1;
        }
        
        #tooltip h3 {
            margin-bottom: 5px;
            color: #00d4ff;
        }
        
        #tooltip p {
            font-size: 0.9rem;
            color: rgba(255,255,255,0.8);
        }
        
        #legend {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        #legend h3 {
            margin-bottom: 10px;
            font-size: 1rem;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 5px 0;
            font-size: 0.9rem;
        }
        
        .legend-color {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #fff;
        }
        
        #info-panel {
            position: fixed;
            right: -350px;
            top: 70px;
            width: 320px;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            transition: right 0.3s;
            z-index: 100;
            max-height: calc(100vh - 100px);
            overflow-y: auto;
        }
        
        #info-panel.visible {
            right: 20px;
        }
        
        #info-panel h2 {
            color: #00d4ff;
            margin-bottom: 10px;
        }
        
        #info-panel .type-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-weight: bold;
        }
        
        #info-panel .connections {
            margin-top: 20px;
        }
        
        #info-panel .connection-item {
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 6px;
            margin: 5px 0;
            font-size: 0.9rem;
        }
        
        .pulse {
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div id="header">
        <h1>NuDay Knowledge Graph</h1>
        <div id="nav-tabs">
            <a href="/nuday-org-chart/" class="nav-tab active">Knowledge Graph</a>
            <a href="/mindmap/" class="nav-tab">Mindmap</a>
        </div>
        <div id="controls">
            <button onclick="resetZoom()">Reset View</button>
            <button onclick="toggleAnimation()">Pause/Play</button>
        </div>
    </div>
    
    <div id="graph"></div>
    
    <div id="tooltip">
        <h3></h3>
        <p></p>
    </div>
    
    <div id="legend">
        <h3>Legend</h3>
        <div class="legend-item">
            <div class="legend-color" style="background: #e74c3c;"></div>
            <span>Person</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #3498db;"></div>
            <span>Agent</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #2ecc71;"></div>
            <span>System</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #f39c12;"></div>
            <span>Concept</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #9b59b6;"></div>
            <span>Project</span>
        </div>
        <div class="legend-item">
            <div class="legend-color" style="background: #1abc9c;"></div>
            <span>Skill</span>
        </div>
    </div>
    
    <div id="info-panel">
        <h2 id="info-title"></h2>
        <div class="type-badge" id="info-type"></div>
        <p id="info-details"></p>
        <div class="connections" id="info-connections"></div>
    </div>

    <script>
        const colors = {
            person: '#e74c3c',
            agent: '#3498db',
            system: '#2ecc71',
            concept: '#f39c12',
            project: '#9b59b6',
            skill: '#1abc9c'
        };
        
        let simulation;
        let isAnimating = true;
        let svg, g, zoom;
        
        // Graph data embedded directly for static hosting
        const data = {
            nodes: [
                // People
                { id: 'yehuda', label: 'Yehuda Mizrahi', type: 'person', emoji: '👤', details: 'CTO of NuDay' },
                
                // Agents
                { id: 'main-agent', label: 'Main Agent', type: 'agent', emoji: '🤖', details: 'General purpose assistant' },
                { id: 'nuday-cto', label: 'NuDay CTO', type: 'agent', emoji: '🚀', details: 'Executive assistant' },
                { id: 'nuday-dev', label: 'NuDay Developer', type: 'agent', emoji: '💻', details: 'Software engineer' },
                { id: 'nuday-therapist', label: 'NuDay PTSD Therapist', type: 'agent', emoji: '🕊️', details: 'Therapeutic support' },
                
                // Systems
                { id: 'workspace', label: 'OpenClaw Workspace', type: 'system', emoji: '🏠', details: 'Multi-agent system' },
                { id: 'memory', label: 'Memory System', type: 'system', emoji: '🧠', details: 'File-based persistence' },
                { id: 'heartbeat', label: 'Heartbeat System', type: 'system', emoji: '💓', details: 'Periodic check-ins' },
                { id: 'cron', label: 'Cron System', type: 'system', emoji: '⏰', details: 'Scheduled tasks' },
                
                // Concepts
                { id: 'agents-pattern', label: 'AGENTS.md Pattern', type: 'concept', emoji: '📋', details: 'Workspace rules' },
                { id: 'soul-pattern', label: 'SOUL.md Pattern', type: 'concept', emoji: '❤️', details: 'Personality & values' },
                { id: 'identity-pattern', label: 'IDENTITY.md Pattern', type: 'concept', emoji: '🆔', details: 'Identity card' },
                { id: 'user-pattern', label: 'USER.md Pattern', type: 'concept', emoji: '👥', details: 'User profile' },
                { id: 'tools-pattern', label: 'TOOLS.md Pattern', type: 'concept', emoji: '🛠️', details: 'Tool notes' },
                
                // Projects
                { id: 'nuday', label: 'NuDay', type: 'project', emoji: '🏢', details: 'Company' },
                
                // Skills
                { id: 'browser-automation', label: 'Browser Automation', type: 'skill', emoji: '🌐', details: 'Web page control and automation' },
                { id: 'canvas', label: 'Canvas', type: 'skill', emoji: '🎨', details: 'HTML canvas presentation' },
                { id: 'diagram-maker', label: 'Diagram Maker', type: 'skill', emoji: '📊', details: 'SVG/HTML diagram creation' },
                { id: 'healthcheck', label: 'Healthcheck', type: 'skill', emoji: '🔒', details: 'Security audit and hardening' },
                { id: 'meme-maker', label: 'Meme Maker', type: 'skill', emoji: '😂', details: 'Meme template search and generation' },
                { id: 'node-connect', label: 'Node Connect', type: 'skill', emoji: '📱', details: 'Device pairing and connection' },
                { id: 'node-inspect-debugger', label: 'Node Debugger', type: 'skill', emoji: '🐛', details: 'Node.js debugging' },
                { id: 'notion', label: 'Notion', type: 'skill', emoji: '📝', details: 'Notion CLI/API integration' },
                { id: 'python-debugpy', label: 'Python Debugpy', type: 'skill', emoji: '🐍', details: 'Python debugging' },
                { id: 'skill-creator', label: 'Skill Creator', type: 'skill', emoji: '🔧', details: 'Skill management and validation' },
                { id: 'spike', label: 'Spike', type: 'skill', emoji: '🧪', details: 'Prototype validation' },
                { id: 'taskflow', label: 'Taskflow', type: 'skill', emoji: '📋', details: 'Multi-step task coordination' },
                { id: 'tmux', label: 'Tmux', type: 'skill', emoji: '🖥️', details: 'Terminal session control' },
                { id: 'weather', label: 'Weather', type: 'skill', emoji: '🌤️', details: 'Weather forecasts' }
            ],
            edges: [
                // Yehuda relationships
                { source: 'yehuda', target: 'main-agent', label: 'uses' },
                { source: 'yehuda', target: 'nuday-cto', label: 'served by' },
                { source: 'yehuda', target: 'nuday-dev', label: 'served by' },
                { source: 'yehuda', target: 'nuday-therapist', label: 'served by' },
                { source: 'yehuda', target: 'nuday', label: 'CTO of' },
                
                // Workspace contains
                { source: 'workspace', target: 'main-agent', label: 'contains' },
                { source: 'workspace', target: 'nuday-cto', label: 'contains' },
                { source: 'workspace', target: 'nuday-dev', label: 'contains' },
                { source: 'workspace', target: 'nuday-therapist', label: 'contains' },
                { source: 'workspace', target: 'memory', label: 'uses' },
                { source: 'workspace', target: 'heartbeat', label: 'uses' },
                { source: 'workspace', target: 'cron', label: 'uses' },
                
                // Patterns used by agents
                { source: 'main-agent', target: 'agents-pattern', label: 'follows' },
                { source: 'main-agent', target: 'soul-pattern', label: 'follows' },
                { source: 'main-agent', target: 'identity-pattern', label: 'follows' },
                { source: 'main-agent', target: 'user-pattern', label: 'follows' },
                { source: 'main-agent', target: 'tools-pattern', label: 'follows' },
                
                { source: 'nuday-cto', target: 'agents-pattern', label: 'follows' },
                { source: 'nuday-cto', target: 'soul-pattern', label: 'follows' },
                { source: 'nuday-cto', target: 'identity-pattern', label: 'follows' },
                
                { source: 'nuday-dev', target: 'agents-pattern', label: 'follows' },
                { source: 'nuday-dev', target: 'soul-pattern', label: 'follows' },
                { source: 'nuday-dev', target: 'identity-pattern', label: 'follows' },
                
                { source: 'nuday-therapist', target: 'agents-pattern', label: 'follows' },
                { source: 'nuday-therapist', target: 'soul-pattern', label: 'follows' },
                { source: 'nuday-therapist', target: 'identity-pattern', label: 'follows' },
                
                // NuDay organization
                { source: 'nuday', target: 'nuday-cto', label: 'has agent' },
                { source: 'nuday', target: 'nuday-dev', label: 'has agent' },
                { source: 'nuday', target: 'nuday-therapist', label: 'has agent' },
                
                // Skills available to workspace
                { source: 'workspace', target: 'browser-automation', label: 'has skill' },
                { source: 'workspace', target: 'canvas', label: 'has skill' },
                { source: 'workspace', target: 'diagram-maker', label: 'has skill' },
                { source: 'workspace', target: 'healthcheck', label: 'has skill' },
                { source: 'workspace', target: 'meme-maker', label: 'has skill' },
                { source: 'workspace', target: 'node-connect', label: 'has skill' },
                { source: 'workspace', target: 'node-inspect-debugger', label: 'has skill' },
                { source: 'workspace', target: 'notion', label: 'has skill' },
                { source: 'workspace', target: 'python-debugpy', label: 'has skill' },
                { source: 'workspace', target: 'skill-creator', label: 'has skill' },
                { source: 'workspace', target: 'spike', label: 'has skill' },
                { source: 'workspace', target: 'taskflow', label: 'has skill' },
                { source: 'workspace', target: 'tmux', label: 'has skill' },
                { source: 'workspace', target: 'weather', label: 'has skill' },
                
                // Agent-specific skills
                { source: 'main-agent', target: 'weather', label: 'uses' },
                { source: 'main-agent', target: 'meme-maker', label: 'uses' },
                { source: 'main-agent', target: 'browser-automation', label: 'uses' },
                { source: 'nuday-cto', target: 'notion', label: 'uses' },
                { source: 'nuday-cto', target: 'taskflow', label: 'uses' },
                { source: 'nuday-cto', target: 'spike', label: 'uses' },
                { source: 'nuday-dev', target: 'node-inspect-debugger', label: 'uses' },
                { source: 'nuday-dev', target: 'python-debugpy', label: 'uses' },
                { source: 'nuday-dev', target: 'skill-creator', label: 'uses' },
                { source: 'nuday-dev', target: 'tmux', label: 'uses' },
                { source: 'nuday-therapist', target: 'healthcheck', label: 'uses' },
                { source: 'nuday-therapist', target: 'browser-automation', label: 'uses' }
            ]
        };
        
        function initGraph() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            
            // Create SVG
            svg = d3.select('#graph')
                .append('svg')
                .attr('width', width)
                .attr('height', height);
            
            // Add zoom behavior
            zoom = d3.zoom()
                .scaleExtent([0.1, 4])
                .on('zoom', (event) => {
                    g.attr('transform', event.transform);
                });
            
            svg.call(zoom);
            
            g = svg.append('g');
            
            // Create force simulation
            simulation = d3.forceSimulation(data.nodes)
                .force('link', d3.forceLink(data.edges).id(d => d.id).distance(150))
                .force('charge', d3.forceManyBody().strength(-500))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(50));
            
            // Create links
            const link = g.append('g')
                .selectAll('line')
                .data(data.edges)
                .enter()
                .append('line')
                .attr('class', 'link');
            
            // Create link labels
            const linkLabel = g.append('g')
                .selectAll('text')
                .data(data.edges)
                .enter()
                .append('text')
                .attr('class', 'link-label')
                .text(d => d.label);
            
            // Create nodes
            const node = g.append('g')
                .selectAll('g')
                .data(data.nodes)
                .enter()
                .append('g')
                .attr('class', 'node')
                .call(d3.drag()
                    .on('start', dragstarted)
                    .on('drag', dragged)
                    .on('end', dragended));
            
            // Add circles to nodes
            node.append('circle')
                .attr('class', 'node-circle')
                .attr('r', 8)
                .attr('fill', d => colors[d.type])
                .attr('fill-opacity', 0.8);
            
            // Add labels to nodes
            node.append('text')
                .attr('class', 'node-label')
                .attr('dy', 50)
                .text(d => d.label);
            
            // Tooltip events
            const tooltip = document.getElementById('tooltip');
            
            node.on('mouseover', (event, d) => {
                tooltip.querySelector('h3').textContent = d.label;
                tooltip.querySelector('p').textContent = d.details;
                tooltip.classList.add('visible');
                tooltip.style.left = event.clientX + 15 + 'px';
                tooltip.style.top = event.clientY + 15 + 'px';
            })
            .on('mousemove', (event) => {
                tooltip.style.left = event.clientX + 15 + 'px';
                tooltip.style.top = event.clientY + 15 + 'px';
            })
            .on('mouseout', () => {
                tooltip.classList.remove('visible');
            })
            .on('click', (event, d) => {
                showInfoPanel(d, data.edges);
                event.stopPropagation();
            });
            
            // Click background to close panel
            svg.on('click', () => {
                document.getElementById('info-panel').classList.remove('visible');
            });
            
            // Update positions on tick
            simulation.on('tick', () => {
                link
                    .attr('x1', d => d.source.x)
                    .attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x)
                    .attr('y2', d => d.target.y);
                
                linkLabel
                    .attr('x', d => (d.source.x + d.target.x) / 2)
                    .attr('y', d => (d.source.y + d.target.y) / 2);
                
                node.attr('transform', d => `translate(${d.x},${d.y})`);
            });
        }
        
        function dragstarted(event, d) {
            if (!event.active) simulation.alphaTarget(0.3).restart();
            d.fx = d.x;
            d.fy = d.y;
        }
        
        function dragged(event, d) {
            d.fx = event.x;
            d.fy = event.y;
        }
        
        function dragended(event, d) {
            if (!event.active) simulation.alphaTarget(0);
            d.fx = null;
            d.fy = null;
        }
        
        function resetZoom() {
            svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity);
        }
        
        function toggleAnimation() {
            if (isAnimating) {
                simulation.stop();
            } else {
                simulation.restart();
            }
            isAnimating = !isAnimating;
        }
        
        function showInfoPanel(nodeData, edges) {
            const panel = document.getElementById('info-panel');
            const title = document.getElementById('info-title');
            const type = document.getElementById('info-type');
            const details = document.getElementById('info-details');
            const connections = document.getElementById('info-connections');
            
            title.textContent = nodeData.label;
            type.textContent = nodeData.type;
            type.style.background = colors[nodeData.type];
            details.textContent = nodeData.details;
            
            // Find connections - handle both object references and string IDs
            const connected = edges.filter(e => {
                const sourceId = typeof e.source === 'object' ? e.source.id : e.source;
                const targetId = typeof e.target === 'object' ? e.target.id : e.target;
                return sourceId === nodeData.id || targetId === nodeData.id;
            });
            
            connections.innerHTML = '<h3>Connections</h3>';
            connected.forEach(edge => {
                const sourceId = typeof edge.source === 'object' ? edge.source.id : edge.source;
                const isSource = sourceId === nodeData.id;
                const other = isSource ? 
                    (typeof edge.target === 'object' ? edge.target : data.nodes.find(n => n.id === edge.target)) :
                    (typeof edge.source === 'object' ? edge.source : data.nodes.find(n => n.id === edge.source));
                
                if (other) {
                    const div = document.createElement('div');
                    div.className = 'connection-item';
                    div.innerHTML = `<strong>${other.label}</strong> <span style="color:#888">(${edge.label})</span>`;
                    connections.appendChild(div);
                }
            });
            
            panel.classList.add('visible');
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            const width = window.innerWidth;
            const height = window.innerHeight;
            svg.attr('width', width).attr('height', height);
            simulation.force('center', d3.forceCenter(width / 2, height / 2));
            simulation.alpha(0.3).restart();
        });
        
        // Initialize
        initGraph();
    </script>
</body>
</html>
